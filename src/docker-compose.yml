services:
  app:
    build:
      context: ./src/app
      dockerfile: Chat.Minimal.Services.api/Dockerfile
    container_name: chat-minimal-api
    restart: always
    ports:
      - "5120:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=chatminimaldb;User=chatuser;Password=chatpassword!@#
      - AISettings__Provider=Groq
      - AISettings__OpenAIApiKey=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
      - AISettings__OpenAIModelName=llama-3.3-70b-versatile
      - AISettings__OpenAIBaseUrl=https://api.groq.com/openai/v1
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: chat-minimal-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chatminimaldb
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpassword!@#
    ports:
      - "3309:3306" # Mapeia porta 3306 do container para 3309 do host
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
